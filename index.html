<!doctype html>
<html lang="sk">
  <head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="theme-color" content="#fffaf4" />
	<meta name="description" content="Malý osobný list plný priateľských spomienok a lásky." />
	<meta property="og:title" content="Pre Terezku ❤️" />
	<meta property="og:description" content="Malý osobný list, ktorý som pripravil iba pre teba." />
	<meta property="og:type" content="website" />
	<title>Pre Terezku ❤️</title>
	<link rel="icon" href="/heart.svg" type="image/svg+xml" />
  </head>
  <body>
	<main class="page-shell" aria-label="Osobný love letter">
	  <section class="letter-card" aria-live="polite">
		<header class="letter-header">
		  <p class="recipient">Pre Terezku ❤️</p>
		  <nav class="progress" aria-label="Postup kapitol">
			<ol id="progress-list"></ol>
		  </nav>
		</header>

		<article class="chapter" id="chapter">
		  <div class="chapter-body" id="chapter-content">
			<h1 id="chapter-title"></h1>
			<p id="chapter-text"></p>
		  </div>
		  <p class="postscript" id="postscript" hidden></p>
		  <div class="floating-hearts" id="floating-hearts" aria-hidden="true">
			<span>♥</span><span>♥</span><span>♥</span>
		  </div>
		</article>

		<footer class="letter-actions">
		  <button class="back-button" id="back-button" type="button" hidden>← Späť</button>
		  <button class="next-button" id="next-button" type="button"></button>
		</footer>
	  </section>
	</main>
	<script type="module" src="/src/main.ts"></script>
  </body>
</html>
